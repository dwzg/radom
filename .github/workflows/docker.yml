# Builds the site image, smoke-tests it, publishes it to the GitHub Container Registry
# (ghcr.io/dwzg/radom) and deploys it by pinning the new tag in github.com/dwzg/docker-compose.
#
# Tags pushed:
#   sha-<short-sha>   every push to main and every v* tag
#   latest            pushes to main
#   1.2.0, 1.2        git tags like v1.2.0
# Pull requests only build and test.
#
# Optional secret (Settings → Secrets and variables → Actions):
#   HOMELAB_DEPLOY_KEY      write deploy key for dwzg/docker-compose. The deploy job pins the
#                           new sha-<short> tag there and Arcane rolls it out. If unset, it is skipped.

name: Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/dwzg/radom

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: rdm-site:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run -d --name site --read-only --tmpfs /tmp rdm-site:test
          for i in $(seq 1 10); do
            docker exec site wget -qO- http://127.0.0.1:8080/healthz && break
            sleep 1
          done
          docker exec site wget -qO- http://127.0.0.1:8080/ | grep -q "<title>RDM"
          docker rm -f site

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Short commit
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      # Arcane deploys hosts/vps/radom from github.com/dwzg/docker-compose: pinning the new
      # tag there is the deployment (live within ~5 minutes). Roll back by reverting that commit.
      - name: Deploy via the homelab repo
        env:
          DEPLOY_KEY: ${{ secrets.HOMELAB_DEPLOY_KEY }}
          STACK: radom
          IMAGE: ghcr.io/dwzg/radom
          TAG: sha-${{ steps.sha.outputs.short }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then echo "::notice::No HOMELAB_DEPLOY_KEY secret, so nothing was deployed"; exit 0; fi
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/homelab && chmod 600 ~/.ssh/homelab
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/homelab -o IdentitiesOnly=yes"
          git clone --quiet --depth 1 git@github.com:dwzg/docker-compose.git "$RUNNER_TEMP/homelab"
          cd "$RUNNER_TEMP/homelab"
          file="hosts/vps/$STACK/compose.yaml"
          sed -i -E "s#(image: ${IMAGE}):[^[:space:]]+#\1:${TAG}#" "$file"
          if git diff --quiet; then echo "$file already runs $TAG"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qam "deploy($STACK): $TAG" -m "Built by $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          for i in 1 2 3; do git push -q && exit 0; git pull -q --rebase; done
          exit 1
