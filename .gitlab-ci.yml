# Builds the site image, publishes it to this project's GitLab Container Registry,
# and optionally tells Portainer to redeploy.
#
# Tags pushed to the registry:
#   <short-sha>   every pipeline on a branch or tag
#   latest        commits on the default branch
#   <git tag>     git tags, e.g. v1.2.0
#
# Optional CI/CD variable (Settings → CI/CD → Variables, masked + protected):
#   PORTAINER_WEBHOOK_URL   Portainer stack/service webhook. If set, the deploy job
#                           calls it after `latest` is pushed. If unset, deploy is skipped.
#   PORTAINER_DEPLOY_MANUAL Set to "true" to make the deploy a manual button instead.

stages:
  - build
  - release
  - deploy

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

variables:
  DOCKER_TLS_CERTDIR: "/certs"
  IMAGE: $CI_REGISTRY_IMAGE

.docker:
  image: docker:27
  services:
    - docker:27-dind
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

build:
  extends: .docker
  stage: build
  script:
    - docker pull "$IMAGE:latest" || true
    - docker build --pull --cache-from "$IMAGE:latest" -t "$IMAGE:$CI_COMMIT_SHORT_SHA" .
    # Smoke test: the container starts read-only and serves the page
    - docker run -d --name site --read-only --tmpfs /tmp "$IMAGE:$CI_COMMIT_SHORT_SHA"
    - |
      for i in $(seq 1 10); do
        docker exec site wget -qO- http://127.0.0.1:8080/healthz && break
        sleep 1
      done
    - docker exec site wget -qO- http://127.0.0.1:8080/ | grep -q "<title>RDM"
    - docker rm -f site
    # Merge requests only build and test; branches and tags push the image
    - |
      if [ "$CI_PIPELINE_SOURCE" != "merge_request_event" ]; then
        docker push "$IMAGE:$CI_COMMIT_SHORT_SHA"
      fi

release:
  extends: .docker
  stage: release
  script:
    - docker pull "$IMAGE:$CI_COMMIT_SHORT_SHA"
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then TAG="$CI_COMMIT_TAG"; else TAG="latest"; fi
      docker tag "$IMAGE:$CI_COMMIT_SHORT_SHA" "$IMAGE:$TAG"
      docker push "$IMAGE:$TAG"
      echo "Released $IMAGE:$TAG"
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy:
  stage: deploy
  image: curlimages/curl:8.11.1
  environment:
    name: production
  script:
    - curl -fsS -X POST --retry 3 --retry-delay 5 "$PORTAINER_WEBHOOK_URL" -o /dev/null
    - echo "Portainer redeploy triggered"
  rules:
    - if: $PORTAINER_WEBHOOK_URL && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $PORTAINER_DEPLOY_MANUAL == "true"
      when: manual
    - if: $PORTAINER_WEBHOOK_URL && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
