# Production stack for Portainer: runs the image published by the GitHub Actions workflow.
# Override RDM_IMAGE in the stack's environment variables to pin a version, e.g.
#   RDM_IMAGE=ghcr.io/dwzg/radom:1.0.0
# No ports are published; the reverse proxy reaches the site at http://rdm-site:8080.
services:
  web:
    image: ${RDM_IMAGE:-ghcr.io/dwzg/radom:latest}
    container_name: rdm-site
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    expose:
      - "8080"
    # For nginx-proxy (nginxproxy/nginx-proxy), set your domain here:
    # environment:
    #   VIRTUAL_HOST: rdm.example.com
    #   VIRTUAL_PORT: "8080"
    networks:
      - nginx-proxy-network

networks:
  nginx-proxy-network:
    external: true
